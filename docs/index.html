<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4e78">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Inventario T12">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<title>Inventario Pescadería — Tienda 12</title>
<style>
:root{--azul:#1f4e78;--azul2:#2e75b6;--verde:#2e7d32;--amar:#c77700;--bg:#f4f6f9;--line:#e2e6ec;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:#1a2230;
     padding-bottom:150px;padding-top:env(safe-area-inset-top);}
header{position:sticky;top:0;z-index:20;background:var(--azul);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;box-shadow:0 2px 8px rgba(0,0,0,.15);}
header h1{margin:0;font-size:17px;font-weight:700;}
header .sub{font-size:11px;opacity:.85;margin-top:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
#refresh{background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:8px;padding:4px 8px;font-size:11px;cursor:pointer;}
.tools{display:flex;gap:8px;padding:10px 12px;position:sticky;top:60px;background:var(--bg);z-index:19;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center;}
#buscar{flex:1;min-width:150px;padding:12px 14px;border:2px solid var(--azul2);border-radius:12px;font-size:16px;outline:none;}
.btn{border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-size:14px;font-weight:600;cursor:pointer;background:#fff;color:var(--azul);}
.btn.on{background:var(--azul2);color:#fff;border-color:var(--azul2);}
.wrap{padding:8px 10px;}
.msg{padding:16px;margin:10px;border-radius:12px;background:#fff;border:1px solid var(--line);font-size:14px;color:#4a5568;}
.row{display:grid;grid-template-columns:1fr 90px 104px;gap:8px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:7px;}
.pname{font-weight:600;font-size:15px;line-height:1.15;}
.pmeta{font-size:11px;color:#8a94a3;margin-top:2px;}
.pmeta .old{color:var(--amar);font-weight:600;}
.new{display:inline-block;background:var(--verde);color:#fff;font-size:10px;font-weight:800;
     padding:2px 7px;border-radius:20px;margin-left:6px;vertical-align:middle;letter-spacing:.3px;}
.price{font-weight:700;color:var(--azul);font-size:14px;text-align:right;white-space:nowrap;}
.price small{display:block;font-weight:400;color:#8a94a3;font-size:10px;}
/* casilla de peso: ya NO es input -> no abre el teclado del sistema */
.peso{width:100%;min-height:46px;padding:10px 6px;border:2px solid #d6dbe3;border-radius:12px;font-size:18px;
      text-align:center;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;background:#fff;}
.peso .ph{color:#aab2bf;font-size:15px;}
.peso.filled{border-color:var(--verde);background:#f2fbf3;font-weight:700;}
.peso.sel{border-color:var(--azul2);background:#eef6ff;box-shadow:0 0 0 3px rgba(46,117,182,.18);}
.imp{grid-column:1/-1;display:none;justify-content:space-between;font-size:12px;color:#4a5568;border-top:1px dashed var(--line);margin-top:8px;padding-top:6px;}
.row.has .imp{display:flex;}
.imp b{color:#1a2230;}
footer{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:2px solid var(--azul);box-shadow:0 -3px 12px rgba(0,0,0,.12);
       padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:30;}
.totrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
.totrow .lab{font-size:12px;color:#6a7686;}
.totrow .val{font-size:15px;font-weight:700;}
.totrow.big .val{font-size:23px;color:var(--verde);}
.fbtns{display:flex;gap:8px;margin-top:9px;}
.fbtns .btn{flex:1;text-align:center;}
.fbtns .pdf{background:var(--azul);color:#fff;border-color:var(--azul);}
.fbtns .csv{background:#fff;}
.fbtns .clr{flex:0 0 auto;color:#b23b3b;}
/* ---- teclado numerico propio (no aparece el del sistema) ---- */
.keypad{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:2px solid var(--azul);
        box-shadow:0 -4px 16px rgba(0,0,0,.18);padding:8px 10px calc(8px + env(safe-area-inset-bottom));
        transform:translateY(115%);transition:transform .18s ease;}
.keypad.open{transform:translateY(0);}
.kp-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:2px 4px 8px;}
.kp-head .prod{font-weight:700;font-size:14px;color:var(--azul);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.kp-head .val{font-size:22px;font-weight:800;color:#1a2230;min-width:70px;text-align:right;}
.kp-head .val small{font-size:12px;font-weight:600;color:#8a94a3;margin-left:3px;}
.kp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.kp-grid button{font-size:22px;font-weight:700;padding:14px 0;border:1px solid var(--line);border-radius:12px;
                background:#f7f9fc;color:#1a2230;cursor:pointer;}
.kp-grid button:active{background:#e6eef8;}
.kp-grid button.del{color:#b23b3b;}
.kp-act{display:flex;gap:8px;margin-top:8px;}
.kp-act button{flex:1;font-size:15px;font-weight:700;padding:13px 0;border-radius:12px;border:none;cursor:pointer;}
.kp-act .next{background:#eef2f7;color:var(--azul);}
.kp-act .done{background:var(--verde);color:#fff;}
body.kp-on{padding-bottom:360px;}
body.kp-on footer{display:none;}
/* ---- vista imprimible (PDF) ---- */
#printable{display:none;}
@media print{
  body *{visibility:hidden;}
  #printable,#printable *{visibility:visible;}
  #printable{display:block;position:absolute;left:0;top:0;width:100%;padding:0 6mm;}
  @page{margin:12mm;}
}
#printable h2{margin:0 0 2px;font-size:18px;}
#printable .pmeta2{font-size:11px;color:#555;margin-bottom:10px;}
#printable table{width:100%;border-collapse:collapse;font-size:11px;}
#printable th,#printable td{border:1px solid #bbb;padding:4px 6px;text-align:right;}
#printable th{background:#eee;}
#printable td.l,#printable th.l{text-align:left;}
#printable tr.tot td{font-weight:700;background:#eef5ff;font-size:12px;}
</style>
</head>
<body>
<header>
  <h1>🐟 Inventario Pescadería — Tienda 12</h1>
  <div class="sub">
    <span id="estado">Cargando precios…</span>
    <button id="refresh">↻ Actualizar</button>
  </div>
</header>
<div class="tools">
  <input id="buscar" placeholder="🔍 Buscar producto…" autocomplete="off" inputmode="search">
  <button class="btn" id="fpeso">Solo con peso</button>
  <button class="btn" id="fnuevo">🆕 Nuevos</button>
</div>
<div class="wrap" id="lista"></div>

<footer>
  <div class="totrow"><span class="lab">Pesados / peso total</span><span class="val" id="tinfo">0 · 0,00 kg</span></div>
  <div class="totrow"><span class="lab">TOTAL sin IVA</span><span class="val" id="tsin">0,00 €</span></div>
  <div class="totrow big"><span class="lab">TOTAL con IVA (10%)</span><span class="val" id="tcon">0,00 €</span></div>
  <div class="fbtns">
    <button class="btn pdf" id="pdf">📄 PDF gestoría</button>
    <button class="btn csv" id="csv">⬇︎ CSV</button>
    <button class="btn clr" id="clr">🗑</button>
  </div>
</footer>

<div id="keypad" class="keypad">
  <div class="kp-head">
    <span class="prod" id="kp-prod">—</span>
    <span class="val"><span id="kp-val">0</span><small>kg</small></span>
  </div>
  <div class="kp-grid">
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button data-k=",">,</button><button data-k="0">0</button><button class="del" data-k="del">⌫</button>
  </div>
  <div class="kp-act">
    <button class="next" id="kp-next">Siguiente ▾</button>
    <button class="done" id="kp-done">Listo ✓</button>
  </div>
</div>

<div id="printable"></div>

<script>
const KEY = "inv_pesca_t12";
const MESKEY = "inv_pesca_mes";   // mes (YYYY-MM) al que pertenecen los pesos apuntados
let DATA = [];               // [{n,p,f}]
let FECHA_DATO = null;
let pesos = JSON.parse(localStorage.getItem(KEY) || "{}");
let soloConPeso = false;
let soloNuevos = false;

const mesActual = ()=> new Date().toISOString().slice(0,7);
const nombreMes = ym => { const [y,m]=ym.split("-"); return new Date(y, m-1, 1).toLocaleDateString("es-ES",{month:"long",year:"numeric"}); };

// avisa si hay pesos de un mes anterior (evita arrastrar el inventario del mes pasado)
function chequearMes(){
  const guardado = localStorage.getItem(MESKEY);
  if(Object.keys(pesos).length && guardado && guardado!==mesActual()){
    if(confirm(`Tienes pesos apuntados de ${nombreMes(guardado)}.\n¿Empezar un inventario nuevo y vaciarlos?`)){
      pesos={}; localStorage.setItem(KEY,"{}"); localStorage.removeItem(MESKEY); render();
    }
  }
}

const r2  = n => Math.round(n*100)/100;   // a centimo: total = suma de filas mostradas
const eur = n => n.toLocaleString("es-ES",{minimumFractionDigits:2,maximumFractionDigits:2})+" €";
const kg  = n => n.toLocaleString("es-ES",{minimumFractionDigits:2,maximumFractionDigits:2})+" kg";
const $ = s => document.querySelector(s);
const lista = $("#lista");

// meses de antiguedad de un precio (para avisar de precios rancios)
function mesesDesde(fiso){
  const d = new Date(fiso+"T00:00:00");
  return Math.floor((Date.now()-d.getTime())/(1000*60*60*24*30.4));
}

async function cargar(){
  $("#estado").textContent = "Cargando precios…";
  try{
    const res = await fetch("catalogo.json?t="+Date.now(), {cache:"no-store"});
    if(!res.ok) throw new Error("http "+res.status);
    const j = await res.json();
    DATA = j.productos || [];
    FECHA_DATO = j.fecha_dato;
    $("#estado").textContent = "Precios al "+ (FECHA_DATO||"?") + " · "+DATA.length+" productos";
    render();
  }catch(e){
    if(DATA.length){ render(); }        // ya teniamos datos cacheados
    else lista.innerHTML = '<div class="msg">⚠️ No se pudieron cargar los precios. Conéctate a internet una vez y pulsa <b>↻ Actualizar</b>. Después funcionará también sin conexión.</div>';
    $("#estado").textContent = "Sin conexión";
  }
}

function render(){
  const q = $("#buscar").value.trim().toLowerCase();
  lista.innerHTML = "";
  let mostrados = 0;
  DATA.forEach(d=>{
    const peso = pesos[d.n];
    if(soloConPeso && !(peso>0)) return;
    if(soloNuevos && !d.nuevo) return;
    if(q && !d.n.toLowerCase().includes(q)) return;
    mostrados++;
    const meses = mesesDesde(d.f);
    const viejo = meses>=6 ? `<span class="old">· precio de hace ${meses} meses</span>` : "";
    const nuevo = d.nuevo ? `<span class="new">🆕 NUEVO</span>` : "";
    const sin = (peso>0?r2(peso*d.p):0), con = r2(sin*1.1);
    const row = document.createElement("div");
    row.className = "row" + (peso>0?" has":"");
    row.innerHTML = `
      <div><div class="pname">${d.n}${nuevo}</div><div class="pmeta">${eur(d.p)}/kg · ${d.f} ${viejo}</div></div>
      <div class="price">${eur(d.p)}<small>por kg</small></div>
      <div class="peso ${peso>0?'filled':''}" data-n="${encodeURIComponent(d.n)}">${peso!=null?String(peso).replace('.',','):'<span class="ph">kg</span>'}</div>
      <div class="imp"><span>SIN IVA: <b>${eur(sin)}</b></span><span>CON IVA: <b>${eur(con)}</b></span></div>`;
    lista.appendChild(row);
  });
  if(DATA.length && mostrados===0) lista.innerHTML = '<div class="msg">Sin resultados para la búsqueda.</div>';
  totales();
}

function totales(){
  let n=0,pk=0,sin=0,con=0;
  for(const d of DATA){const p=pesos[d.n]; if(p>0){const s=r2(p*d.p); n++;pk+=p;sin+=s;con+=r2(s*1.1);}}
  $("#tinfo").textContent = n+" · "+kg(pk);
  $("#tsin").textContent = eur(r2(sin));
  $("#tcon").textContent = eur(r2(con));
}

// ---- teclado numerico propio ----
let sel = null;   // celda seleccionada {name, el}
let buf = "";     // string en edicion (formato es: "1,25")

lista.addEventListener("click", e=>{
  const cell = e.target.closest(".peso");
  if(cell) abrirKeypad(decodeURIComponent(cell.dataset.n), cell);
});

function abrirKeypad(name, el){
  sel = {name, el};
  buf = pesos[name]!=null ? String(pesos[name]).replace(".",",") : "";
  document.querySelectorAll(".peso.sel").forEach(x=>x.classList.remove("sel"));
  el.classList.add("sel");
  $("#kp-prod").textContent = name;
  $("#keypad").classList.add("open");
  document.body.classList.add("kp-on");
  pintarVal();
  el.scrollIntoView({block:"center", behavior:"smooth"});
}

function cerrarKeypad(){
  document.querySelectorAll(".peso.sel").forEach(x=>x.classList.remove("sel"));
  $("#keypad").classList.remove("open");
  document.body.classList.remove("kp-on");
  sel = null;
}

function pintarVal(){ $("#kp-val").textContent = buf==="" ? "0" : buf; }

function tecla(k){
  if(!sel) return;
  if(k==="del"){ buf = buf.slice(0,-1); }
  else if(k===","){ if(!buf.includes(",")) buf = (buf==="" ? "0," : buf+","); }
  else{ // digito
    if(buf==="0") buf = k;                 // sustituye el cero inicial
    else buf += k;
    const dec = buf.split(",")[1];
    if(dec && dec.length>3) buf = buf.slice(0,-1);   // max 3 decimales
  }
  aplicar();
}

function aplicar(){
  const {name, el} = sel;
  const v = parseFloat(buf.replace(",","."));
  if(buf==="" || isNaN(v) || v<=0) delete pesos[name];
  else pesos[name] = v;
  localStorage.setItem(KEY, JSON.stringify(pesos));
  if(Object.keys(pesos).length && !localStorage.getItem(MESKEY)) localStorage.setItem(MESKEY, mesActual());
  const ok = pesos[name]>0;
  el.innerHTML = buf==="" ? '<span class="ph">kg</span>' : buf;
  el.classList.toggle("filled", ok);
  const row = el.closest(".row"); row.classList.toggle("has", ok);
  const d = DATA.find(x=>x.n===name); const s = ok ? r2(pesos[name]*d.p) : 0;
  const imp = row.querySelector(".imp");
  if(imp) imp.innerHTML = `<span>SIN IVA: <b>${eur(s)}</b></span><span>CON IVA: <b>${eur(r2(s*1.1))}</b></span>`;
  pintarVal();
  totales();
}

$("#keypad").addEventListener("click", e=>{
  const b = e.target.closest("button[data-k]");
  if(b) tecla(b.dataset.k);
});
$("#kp-done").addEventListener("click", cerrarKeypad);
$("#kp-next").addEventListener("click", ()=>{
  const cells = [...lista.querySelectorAll(".peso")];
  const nxt = cells[cells.indexOf(sel.el)+1];
  if(nxt) abrirKeypad(decodeURIComponent(nxt.dataset.n), nxt);
  else cerrarKeypad();
});

let tBuscar;   // debounce: no reconstruir las 133 filas en cada tecla
$("#buscar").addEventListener("input", ()=>{ cerrarKeypad(); clearTimeout(tBuscar); tBuscar=setTimeout(render,120); });
$("#buscar").addEventListener("focus", cerrarKeypad);
$("#refresh").addEventListener("click", cargar);
$("#fpeso").addEventListener("click", e=>{ cerrarKeypad(); soloConPeso=!soloConPeso; e.target.classList.toggle("on",soloConPeso); render(); });
$("#fnuevo").addEventListener("click", e=>{ cerrarKeypad(); soloNuevos=!soloNuevos; e.target.classList.toggle("on",soloNuevos); render(); });

// cerrar el teclado al tocar fuera (no si se toca otra celda -> la reabre, ni el propio teclado)
document.addEventListener("click", e=>{
  if(sel && !e.target.closest("#keypad") && !e.target.closest(".peso")) cerrarKeypad();
});
$("#clr").addEventListener("click", ()=>{ if(confirm("¿Vaciar todos los pesos introducidos?")){ cerrarKeypad(); pesos={}; localStorage.setItem(KEY,"{}"); localStorage.removeItem(MESKEY); render(); }});

// filas con peso, para exportar
function pesados(){
  const out=[];
  for(const d of DATA){const p=pesos[d.n]; if(p>0){const s=r2(p*d.p); out.push({n:d.n,p:d.p,f:d.f,peso:p,sin:s,con:r2(s*1.1)});}}
  out.sort((a,b)=>a.n.localeCompare(b.n));
  return out;
}
const hoyES = ()=> new Date().toLocaleDateString("es-ES",{day:"2-digit",month:"2-digit",year:"numeric"});

// ---- PDF (via impresion del navegador -> Guardar/Compartir como PDF) ----
$("#pdf").addEventListener("click", ()=>{
  const rows = pesados();
  if(!rows.length){ alert("Introduce algún peso antes de generar el PDF."); return; }
  let tsin=0,tcon=0,tpk=0;
  let tr = rows.map(r=>{ tsin+=r.sin; tcon+=r.con; tpk+=r.peso;
    return `<tr><td class="l">${r.n}</td><td>${r.peso.toLocaleString("es-ES",{minimumFractionDigits:2,maximumFractionDigits:3})}</td><td>${eur(r.p)}</td><td>${eur(r.sin)}</td><td>${eur(r.con)}</td></tr>`;
  }).join("");
  $("#printable").innerHTML = `
    <h2>Inventario de stock — Pescadería Tienda 12</h2>
    <div class="pmeta2">Fecha inventario: ${hoyES()} · Precios: última compra registrada (dato más reciente ${FECHA_DATO||"?"}) · ${rows.length} productos</div>
    <table>
      <thead><tr><th class="l">Producto</th><th>Peso (kg)</th><th>€/kg s/IVA</th><th>Importe s/IVA</th><th>Importe c/IVA 10%</th></tr></thead>
      <tbody>${tr}
        <tr class="tot"><td class="l">TOTAL (${tpk.toLocaleString("es-ES",{minimumFractionDigits:2,maximumFractionDigits:2})} kg)</td><td></td><td></td><td>${eur(tsin)}</td><td>${eur(tcon)}</td></tr>
      </tbody>
    </table>`;
  // el nombre sugerido del PDF sale del title -> le metemos la fecha (dd-mm-aaaa)
  const tituloPrev = document.title;
  document.title = "Inventario Tienda 12 - " + hoyES().replace(/\//g,"-");
  window.print();
  setTimeout(()=>{ document.title = tituloPrev; }, 1500);
});

// ---- CSV (compartir en movil o descargar) ----
$("#csv").addEventListener("click", async ()=>{
  const rows = pesados();
  if(!rows.length){ alert("Introduce algún peso antes de exportar."); return; }
  let out=[["Producto","Precio EUR/kg sin IVA","Fecha precio","Peso kg","Importe sin IVA","Importe con IVA 10%"]];
  let tsin=0,tcon=0;
  rows.forEach(r=>{ tsin+=r.sin; tcon+=r.con;
    out.push([r.n, r.p.toFixed(2), r.f, String(r.peso).replace(".",","), r.sin.toFixed(2), r.con.toFixed(2)]);
  });
  out.push(["TOTAL","","","",tsin.toFixed(2),tcon.toFixed(2)]);
  const csv = "﻿"+out.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(";")).join("\r\n");
  const fname = "inventario_tienda12_"+new Date().toISOString().slice(0,10)+".csv";
  const file = new File([csv], fname, {type:"text/csv"});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title:"Inventario Tienda 12"}); return; }catch(e){ if(e.name==="AbortError") return; }
  }
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"})); a.download=fname; a.click();
});

// service worker (offline / instalar en pantalla de inicio)
if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }

cargar().then(chequearMes);
</script>
</body>
</html>
