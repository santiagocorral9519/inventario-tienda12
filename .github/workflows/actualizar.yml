name: Actualizar precios

on:
  schedule:
    - cron: "17 5 * * *"      # cada dia ~07:17 hora España (05:17 UTC)
  workflow_dispatch:            # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write               # para guardar docs/catalogo.json actualizado

concurrency:
  group: actualizar-precios
  cancel-in-progress: false

jobs:
  refrescar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Generar catalogo desde Dropbox
        env:
          DROPBOX_URL: ${{ secrets.DROPBOX_URL }}
        run: python refrescar.py

      - name: Guardar cambios si el catalogo cambio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git status --porcelain docs/catalogo.json | grep -q .; then
            git add docs/catalogo.json
            git commit -m "Actualizar precios ($(date -u +%Y-%m-%d))"
            git push
            echo "Catalogo actualizado."
          else
            echo "Sin cambios en el catalogo."
          fi
